name: Label Conflict Resolution
run-name: Label Conflict ${{ github.event.issue.number }}

on:
  issues:
    types: [labeled]

permissions:
  contents: read
  issues: write

jobs:
  resolve-conflict:
    runs-on: ubuntu-latest
    steps:
      - name: Check and remove conflicting labels
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          LABELS=$(curl -s \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/issues/$ISSUE_NUMBER" |
            jq -r '.labels[].name')

          if [[ "$LABELS" == *"approved"* ]]; then
            for label in denied needs-info; do
              if [[ "$LABELS" == *"$label"* ]]; then
                echo "Removing '$label' because 'approved' is already present."
                curl -s -X DELETE \
                  -H "Authorization: token $GITHUB_TOKEN" \
                  -H "Accept: application/vnd.github.v3+json" \
                  "https://api.github.com/repos/${{ github.repository }}/issues/$ISSUE_NUMBER/labels/$label"
              fi
            done
          fi
