name: Add Issue to Project
run-name: Add Issue to Project ${{ github.event.issue.number }}

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write
  repository-projects: write

jobs:
  add-to-project:
    if: contains(github.event.issue.labels.*.name, 'access-request')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Add issue to project
        env:
          GH_TOKEN: ${{ secrets.PROJECT_AUTOMATION }}
          PROJECT_ID: "PVT_kwDOEi48RM4BeAPn"
          ISSUE_NODE_ID: ${{ github.event.issue.node_id }}
        run: |
          set -eu
          echo "Adding issue to project..."
          echo "PROJECT_ID: $PROJECT_ID"
          echo "ISSUE_NODE_ID: $ISSUE_NODE_ID"

          ITEM_ID=""
          for attempt in 1 2 3; do
            # -f sends plain strings (no type guessing). The mutation is idempotent:
            # adding an issue that is already on the board returns the existing item.
            if RESPONSE=$(gh api graphql -f query='
              mutation($project:ID!,$issue:ID!){
                addProjectV2ItemById(input:{
                  projectId:$project
                  contentId:$issue
                }){
                  item{
                    id
                  }
                }
              }' -f project="$PROJECT_ID" -f issue="$ISSUE_NODE_ID" 2>&1); then
              ITEM_ID=$(printf '%s' "$RESPONSE" | jq -r '.data.addProjectV2ItemById.item.id // empty')
              if [ -n "$ITEM_ID" ]; then
                break
              fi
            fi
            echo "Attempt $attempt failed: $RESPONSE"
            sleep $((attempt * 5))
          done

          if [ -z "$ITEM_ID" ]; then
            echo "::error::Failed to add issue to project"
            exit 1
          fi

          echo "✅ Issue added to project with Item ID: $ITEM_ID"
