name: Grant Access
run-name: Grant Access ${{ github.event.issue.number }}

on:
  issues:
    types: [labeled]

permissions:
  contents: read
  issues: write

jobs:
  grant:
    if: github.event.label.name == 'approved' || github.event.label.name == 'fixed'
    runs-on: ubuntu-latest
    steps:
      - name: Get issue details
        id: get_issue
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -e
          RESPONSE=$(curl -s -o issue.json -w "%{http_code}" \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/issues/$ISSUE_NUMBER")
          if [ "$RESPONSE" -ne 200 ]; then
            echo "::error::Failed to get issue details. HTTP code: $RESPONSE"
            exit 1
          fi
          BODY_DELIMITER=$(openssl rand -hex 16)
          LABELS_DELIMITER=$(openssl rand -hex 16)
          echo "body<<$BODY_DELIMITER" >> "$GITHUB_OUTPUT"
          jq -r '.body' issue.json >> "$GITHUB_OUTPUT"
          echo "$BODY_DELIMITER" >> "$GITHUB_OUTPUT"
          echo "labels<<$LABELS_DELIMITER" >> "$GITHUB_OUTPUT"
          jq -r '.labels[].name' issue.json >> "$GITHUB_OUTPUT"
          echo "$LABELS_DELIMITER" >> "$GITHUB_OUTPUT"

      - name: Parse request details
        id: parse
        env:
          BODY: ${{ steps.get_issue.outputs.body }}
          LABELS: ${{ steps.get_issue.outputs.labels }}
        run: |
          extract_value() {
            local field="$1"
            local body="$2"
            local value
            if ! printf '%s\n' "$body" | grep -Fqx "### $field"; then
              echo ""
              return
            fi
            value=$(printf '%s\n' "$body" |
              awk -v field="### $field" '
                $0 == field {
                  found=1
                  next
                }
                found && NF {
                  print
                  exit
                }
              ')
            if [[ "$value" == "---"* || "$value" == "###"* ]]; then
              value=""
            fi
            echo "$value" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//'
          }
          USERNAME=$(extract_value "GitHub Username" "$BODY")
          DURATION=$(extract_value "Duration" "$BODY")
          APPROVER=$(extract_value "Approver" "$BODY")
          echo "username=$USERNAME" >> "$GITHUB_OUTPUT"
          echo "duration=$DURATION" >> "$GITHUB_OUTPUT"
          echo "approver=$APPROVER" >> "$GITHUB_OUTPUT"
          if [[ "$LABELS" == *"team-based"* ]]; then
            TEAM=$(extract_value "GitHub Team Name" "$BODY")
            echo "type=team" >> "$GITHUB_OUTPUT"
            echo "target=$TEAM" >> "$GITHUB_OUTPUT"
          elif [[ "$LABELS" == *"repo-based"* ]]; then
            REPO=$(extract_value "Repository Name" "$BODY")
            [[ "$REPO" != */* ]] && REPO="${{ github.repository_owner }}/$REPO"
            PERMISSION=$(extract_value "Permission Level" "$BODY")
            PERMISSION_LOWER=$(echo "$PERMISSION" | tr '[:upper:]' '[:lower:]')
            echo "type=repo" >> "$GITHUB_OUTPUT"
            echo "target=$REPO" >> "$GITHUB_OUTPUT"
            echo "permission=$PERMISSION_LOWER" >> "$GITHUB_OUTPUT"
          fi

      - name: Check if actor is authorized
        env:
          ACTOR: ${{ github.actor }}
          EVENT_LABEL: ${{ github.event.label.name }}
          APPROVER: ${{ steps.parse.outputs.approver }}
          LABELS: ${{ steps.get_issue.outputs.labels }}
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          SUPPORT_USERS: "pujadas02"
        run: |
          if [[ "$EVENT_LABEL" == "approved" ]]; then
            if printf '%s\n' "$LABELS" | grep -Fxq "access-granted"; then
              echo "Access has already been granted for this request."
              exit 0
            fi
            if [[ -z "$APPROVER" ]]; then
              echo "Error: No approver is specified in the issue."
              exit 1
            fi
            if [[ "$ACTOR" != "$APPROVER" ]]; then
              echo "Error: '$ACTOR' is not the approver specified in the issue."
              RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" \
                -X DELETE \
                -H "Authorization: token $GITHUB_TOKEN" \
                -H "Accept: application/vnd.github.v3+json" \
                "https://api.github.com/repos/${{ github.repository }}/issues/$ISSUE_NUMBER/labels/approved")
              if [ "$RESPONSE" -eq 200 ]; then
                echo "Unauthorized 'approved' label removed."
              else
                echo "::error::Failed to remove unauthorized 'approved' label. HTTP code: $RESPONSE"
              fi
              exit 1
            fi
            echo "'$ACTOR' matches the approver specified in the issue."
          elif [[ "$EVENT_LABEL" == "fixed" ]]; then
            if printf '%s\n' "$LABELS" | grep -Fxq "access-granted"; then
              echo "Access has already been granted for this request."
              exit 0
            fi
            if ! printf '%s\n' "$LABELS" | grep -Fxq "approved"; then
              echo "Error: The issue must have the 'approved' label before 'fixed' can trigger a retry."
              exit 1
            fi
            AUTHORIZED=false
            IFS=',' read -r -a support_array <<< "$SUPPORT_USERS"
            for support_user in "${support_array[@]}"; do
              support_user=$(echo "$support_user" | xargs)
              if [[ "$ACTOR" == "$support_user" ]]; then
                AUTHORIZED=true
                break
              fi
            done
            if [[ "$AUTHORIZED" == "false" ]]; then
              echo "Error: '$ACTOR' is not an authorized support user."
              exit 1
            fi
            echo "'$ACTOR' is an authorized support user and the issue is approved."
          else
            echo "Error: Unsupported label trigger '$EVENT_LABEL'."
            exit 1
          fi

      - name: Calculate expiration
        id: expiration
        run: |
          DURATION="${{ steps.parse.outputs.duration }}"
          if [ -z "$DURATION" ]; then
            DURATION=1
          fi
          EXPIRATION=$(date -u -d "+$DURATION days" +"%Y-%m-%dT%H:%M:%SZ")
          echo "expiration=$EXPIRATION" >> "$GITHUB_OUTPUT"
          echo "Expiration: $EXPIRATION"

      - name: Grant team access
        id: grant_team
        if: steps.parse.outputs.type == 'team' && steps.parse.outputs.username != '' && steps.parse.outputs.target != ''
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
          USERNAME: ${{ steps.parse.outputs.username }}
          TEAM: ${{ steps.parse.outputs.target }}
        run: |
          echo "Adding $USERNAME to team $TEAM..."
          ORG="${{ github.repository_owner }}"
          TEAM_SLUG=""
          PAGE=1
          while true; do
            echo "Searching teams page $PAGE..."
            RESPONSE=$(curl -s \
              -H "Authorization: token $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github.v3+json" \
              "https://api.github.com/orgs/$ORG/teams?per_page=100&page=$PAGE")
            MATCH=$(echo "$RESPONSE" | jq -r --arg TEAM "$TEAM" '
              .[] |
              select(.name == $TEAM or .slug == $TEAM) |
              .slug
            ' | head -1)
            if [ -n "$MATCH" ] && [ "$MATCH" != "null" ]; then
              TEAM_SLUG="$MATCH"
              echo "Team found. Resolved team slug: $TEAM_SLUG"
              break
            fi
            TEAM_COUNT=$(echo "$RESPONSE" | jq 'length')
            if [ "$TEAM_COUNT" -lt 100 ]; then
              echo "::error::Could not find team '$TEAM' in organization '$ORG'."
              exit 1
            fi
            PAGE=$((PAGE + 1))
          done
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" \
            -X PUT \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/orgs/$ORG/teams/$TEAM_SLUG/memberships/$USERNAME")
          if [ "$RESPONSE" -eq 200 ] || [ "$RESPONSE" -eq 201 ] || [ "$RESPONSE" -eq 204 ]; then
            echo "success=true" >> "$GITHUB_OUTPUT"
            echo "granted_type=team" >> "$GITHUB_OUTPUT"
          else
            echo "success=false" >> "$GITHUB_OUTPUT"
            echo "Failed to add user to team. HTTP code: $RESPONSE"
            exit 1
          fi

      - name: Grant repo access
        id: grant_repo
        if: steps.parse.outputs.type == 'repo' && steps.parse.outputs.username != '' && steps.parse.outputs.target != ''
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
          USERNAME: ${{ steps.parse.outputs.username }}
          REPO: ${{ steps.parse.outputs.target }}
          PERMISSION: ${{ steps.parse.outputs.permission }}
        run: |
          echo "Adding $USERNAME to $REPO with $PERMISSION access..."
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" \
            -X PUT \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/$REPO/collaborators/$USERNAME" \
            -d "{\"permission\": \"$PERMISSION\"}")
          if [ "$RESPONSE" -eq 201 ] || [ "$RESPONSE" -eq 204 ]; then
            echo "success=true" >> "$GITHUB_OUTPUT"
            echo "granted_type=repo" >> "$GITHUB_OUTPUT"
          else
            echo "success=false" >> "$GITHUB_OUTPUT"
            echo "Failed to grant access. HTTP code: $RESPONSE"
            exit 1
          fi

      - name: Add access-granted label
        id: add_access_granted
        if: steps.grant_team.outputs.success == 'true' || steps.grant_repo.outputs.success == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/issues/$ISSUE_NUMBER/labels" \
            -d '{"labels":["access-granted"]}')
          if [ "$RESPONSE" -eq 200 ]; then
            echo "access-granted label added successfully."
          else
            echo "::error::Failed to add access-granted label. HTTP code: $RESPONSE"
            exit 1
          fi

      - name: Add expiration label
        id: add_expiration
        if: steps.grant_repo.outputs.success == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          EXPIRATION: ${{ steps.expiration.outputs.expiration }}
        run: |
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/issues/$ISSUE_NUMBER/labels" \
            -d "{\"labels\": [\"expires-$EXPIRATION\"]}")
          if [ "$RESPONSE" -eq 200 ]; then
            echo "success=true" >> "$GITHUB_OUTPUT"
            echo "Expiration label added successfully."
          else
            echo "success=false" >> "$GITHUB_OUTPUT"
            echo "::error::Failed to add expiration label. HTTP code: $RESPONSE"
            exit 1
          fi

      - name: Comment on issue
        if: success() && (steps.grant_team.outputs.success == 'true' || steps.grant_repo.outputs.success == 'true')
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
          USERNAME: ${{ steps.parse.outputs.username }}
          TARGET: ${{ steps.parse.outputs.target }}
          TYPE: ${{ steps.parse.outputs.type }}
          PERMISSION: ${{ steps.parse.outputs.permission }}
          EXPIRATION: ${{ steps.expiration.outputs.expiration }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          if [ "$TYPE" == "team" ]; then
            COMMENT="**Access Granted!**\n\n- **User:** @$USERNAME\n- **Team:** $TARGET\n- **Status:** User has been added to the team."
          else
            COMMENT="**Access Granted!**\n\n- **User:** @$USERNAME\n- **Repository:** $TARGET\n- **Permission:** $PERMISSION\n- **Expires:** $EXPIRATION UTC\n- **Status:** Access has been granted."
          fi
          curl -X POST \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/issues/$ISSUE_NUMBER/comments" \
            -d "{\"body\": \"$COMMENT\"}"

      - name: Close issue (only for team-based)
        if: success() && steps.grant_team.outputs.success == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          echo "Closing issue #$ISSUE_NUMBER (team-based request)"
          curl -X PATCH \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/issues/$ISSUE_NUMBER" \
            -d "{\"state\": \"closed\"}"

      - name: Handle workflow failure
        if: failure()
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
          SUPPORT_USERS: "pujapuja"
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/issues/$ISSUE_NUMBER/labels" \
            -d '{"labels":["access-failed"]}')
          if [ "$RESPONSE" -eq 200 ]; then
            echo "access-failed label added successfully."
          else
            echo "::error::Failed to add access-failed label. HTTP code: $RESPONSE"
          fi
          MENTIONS=""
          IFS=',' read -r -a support_array <<< "$SUPPORT_USERS"
          for support_user in "${support_array[@]}"; do
            support_user=$(echo "$support_user" | xargs)
            if [ -n "$support_user" ]; then
              MENTIONS="$MENTIONS @$support_user"
            fi
          done
          COMMENT="**Access could not be granted.**\n\n$MENTIONS\n\nPlease check the workflow and investigate the issue. Once the issue is resolved, add the \`fixed\` label to retry the request."
          curl -X POST \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/issues/$ISSUE_NUMBER/comments" \
            -d "{\"body\": \"$COMMENT\"}"
