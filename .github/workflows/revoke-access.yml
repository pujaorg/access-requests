name: Revoke Expired Access
on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:
permissions:
  issues: write
env:
  SUPPORT_USERS: "pujadas02"
concurrency:
  group: revoke-expired-access
  cancel-in-progress: false
  queue: max
jobs:
  revoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Revoke expired access
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
          REPO: ${{ github.repository }}
          ORG: ${{ github.repository_owner }}
        run: |
          set -e
          FAILED=false
          CURRENT_ISSUE=""

          extract_value() {
            local field="$1"
            local body="$2"
            local value
            if ! printf '%s\n' "$body" | grep -Fqx "### $field"; then
              echo ""
              return
            fi
            value=$(printf '%s\n' "$body" |
              awk -v field="### $field" '
                $0 == field {
                  found=1
                  next
                }
                found && NF {
                  print
                  exit
                }
              ')
            if [[ "$value" == "---"* || "$value" == "###"* ]]; then
              value=""
            fi
            printf '%s\n' "$value" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//'
          }

          build_mentions() {
            MENTIONS=""
            IFS=',' read -r -a support_array <<< "$SUPPORT_USERS"
            for support_user in "${support_array[@]}"; do
              support_user=$(printf '%s\n' "$support_user" | xargs)
              if [ -n "$support_user" ]; then
                MENTIONS="$MENTIONS @$support_user"
              fi
            done
          }

          report_error() {
            local issue="$1"
            local message="$2"
            local comment

            FAILED=true
            echo "$message"

            gh issue edit "$issue" \
              --repo "$REPO" \
              --remove-label "revoke-fixed" 2>/dev/null || true

            if ! gh issue edit "$issue" \
              --repo "$REPO" \
              --add-label "revoke-error"; then
              echo "Failed to add revoke-error label to issue #$issue"
            fi

            build_mentions
            comment=$(printf '%s\n\n%s\n\n%s' \
              "**Access could not be revoked.**" \
              "$MENTIONS" \
              "Please check the workflow and investigate the issue. Once the issue is resolved, add the \`revoke-fixed\` label to retry the request.")

            if ! gh issue comment "$issue" \
              --repo "$REPO" \
              --body "$comment"; then
              echo "Failed to add error comment to issue #$issue"
            fi
          }

          revoke_repo() {
            local user="$1"
            local repo="$2"
            local status

            [[ "$repo" != *"/"* ]] && repo="$ORG/$repo"

            echo "Checking access for $user on repo $repo"

            status=$(curl -sS -o /dev/null -w "%{http_code}" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "https://api.github.com/repos/$repo/collaborators/$user" || printf '000')

            if [ "$status" = "404" ]; then
              echo "User $user is already removed from repo $repo"
              return 2
            fi

            if [ "$status" != "204" ] && [ "$status" != "200" ]; then
              if [ "$status" = "000" ]; then
                echo "Could not determine collaborator status"
              else
                echo "Failed to check collaborator status. HTTP code: $status"
              fi
              return 1
            fi

            echo "User has access. Removing $user from repo $repo"

            status=$(curl -sS -o /dev/null -w "%{http_code}" \
              -X DELETE \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "https://api.github.com/repos/$repo/collaborators/$user" || printf '000')

            if [ "$status" = "204" ]; then
              echo "Collaborator removed successfully"
              return 0
            fi

            if [ "$status" = "404" ]; then
              echo "User $user is already removed from repo $repo"
              return 2
            fi

            if [ "$status" = "000" ]; then
              echo "Failed to revoke collaborator access"
            else
              echo "Failed to revoke collaborator access. HTTP code: $status"
            fi
            return 1
          }

          gh api --paginate --slurp \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "repos/$REPO/issues?state=open&labels=access-request%2Crepo-based&per_page=100" |
            jq '[.[][] | select(.pull_request == null) | {number, body, labels: [.labels[].name]}]' > issues.json

          CURRENT_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          echo "Current time (UTC): $CURRENT_TIME"

          ISSUE_COUNT=$(jq 'length' issues.json)
          echo "Found $ISSUE_COUNT open repo-based issues."

          if [ "$ISSUE_COUNT" -eq 0 ]; then
            echo "No open repo-based issues found. Exiting."
            exit 0
          fi

          while read -r issue; do
            CURRENT_ISSUE=$(printf '%s\n' "$issue" | jq -r '.number')
            BODY=$(printf '%s\n' "$issue" | jq -r '.body // ""')
            LABELS=$(printf '%s\n' "$issue" | jq -r '.labels[]')

            echo "Processing issue #$CURRENT_ISSUE"

            HAS_REVOKE_ERROR=false
            HAS_REVOKE_FIXED=false
            HAS_ACCESS_REQUEST=false
            HAS_REPO_BASED=false
            HAS_TEAM_BASED=false

            if printf '%s\n' "$LABELS" | grep -Fxq "revoke-error"; then
              HAS_REVOKE_ERROR=true
            fi
            if printf '%s\n' "$LABELS" | grep -Fxq "revoke-fixed"; then
              HAS_REVOKE_FIXED=true
            fi
            if printf '%s\n' "$LABELS" | grep -Fxq "access-request"; then
              HAS_ACCESS_REQUEST=true
            fi
            if printf '%s\n' "$LABELS" | grep -Fxq "repo-based"; then
              HAS_REPO_BASED=true
            fi
            if printf '%s\n' "$LABELS" | grep -Fxq "team-based"; then
              HAS_TEAM_BASED=true
            fi

            if [[ "$HAS_REVOKE_ERROR" == "true" && "$HAS_REVOKE_FIXED" != "true" ]]; then
              echo "Issue has revoke-error and has not been marked revoke-fixed. Skipping."
              continue
            fi

            if [[ "$HAS_REVOKE_FIXED" == "true" && "$HAS_REVOKE_ERROR" != "true" ]]; then
              report_error "$CURRENT_ISSUE" \
                "The 'revoke-fixed' label was found without the 'revoke-error' label. Please investigate."
              continue
            fi

            if [[ "$HAS_REVOKE_ERROR" == "true" && "$HAS_REVOKE_FIXED" == "true" ]]; then
              echo "Issue was marked revoke-fixed. Preparing for retry."

              if ! gh issue edit "$CURRENT_ISSUE" \
                --repo "$REPO" \
                --remove-label "revoke-error" \
                --remove-label "revoke-fixed"; then
                report_error "$CURRENT_ISSUE" \
                  "The retry labels could not be cleared before retrying access revocation. Please investigate."
                continue
              fi

              echo "Retry labels removed."
            fi

            if [[ "$HAS_ACCESS_REQUEST" != "true" ||
              "$HAS_REPO_BASED" != "true" ||
              "$HAS_TEAM_BASED" == "true" ]]; then
              report_error "$CURRENT_ISSUE" \
                "Invalid request labels found. The issue must be an access-request with repo-based access only. Please investigate."
              continue
            fi

            EXPIRATION_LABELS=$(printf '%s\n' "$LABELS" |
              grep -oE '^expires-[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$' || true)

            EXPIRATION_COUNT=$(printf '%s\n' "$EXPIRATION_LABELS" |
              grep -c . || true)

            echo "Expiration labels found: $EXPIRATION_COUNT"

            if [ "$EXPIRATION_COUNT" -eq 0 ]; then
              report_error "$CURRENT_ISSUE" \
                "Expiration label not found. Access was not revoked. Please investigate."
              continue
            fi

            if [ "$EXPIRATION_COUNT" -gt 1 ]; then
              report_error "$CURRENT_ISSUE" \
                "Multiple expiration labels found. Access was not revoked. Please investigate."
              continue
            fi

            EXPIRATION_LABEL="$EXPIRATION_LABELS"
            EXPIRATION=${EXPIRATION_LABEL#expires-}

            PARSED_EXPIRATION=$(date -u -d "$EXPIRATION" +"%Y-%m-%dT%H:%M:%SZ" 2>/dev/null || true)

            if [ "$PARSED_EXPIRATION" != "$EXPIRATION" ]; then
              report_error "$CURRENT_ISSUE" \
                "The expiration label contains an invalid date. Access was not revoked. Please investigate."
              continue
            fi

            echo "Expiration label: $EXPIRATION_LABEL"
            echo "Expiration date: $EXPIRATION"

            if [[ "$CURRENT_TIME" < "$EXPIRATION" ]]; then
              echo "Not expired yet."
              continue
            fi

            echo "Access has expired."

            USERNAME=$(extract_value "GitHub Username" "$BODY")
            REPO_NAME=$(extract_value "Repository Name" "$BODY")

            echo "Username: $USERNAME"
            echo "Repo: $REPO_NAME"

            if [ -z "$USERNAME" ] || [ -z "$REPO_NAME" ]; then
              report_error "$CURRENT_ISSUE" \
                "Could not determine the GitHub username or repository. Access was not revoked. Please investigate."
              continue
            fi

            set +e
            revoke_repo "$USERNAME" "$REPO_NAME"
            REVOKE_RESULT=$?
            set -e

            if [ "$REVOKE_RESULT" -eq 1 ]; then
              report_error "$CURRENT_ISSUE" \
                "Failed to revoke access from repo: $REPO_NAME. Access was not revoked. Please investigate."
              continue
            fi

            if [ "$REVOKE_RESULT" -eq 2 ]; then
              echo "Access was already removed from repo: $REPO_NAME"
              COMMENT=$(printf '%s\n\n%s' \
                "**Access Revoked!**" \
                "- **User:** @$USERNAME
              - **Repository:** $REPO_NAME
              - **Status:** Access was already removed. No revocation was required.")

              if ! gh issue comment "$CURRENT_ISSUE" \
                --repo "$REPO" \
                --body "$COMMENT"; then
                report_error "$CURRENT_ISSUE" \
                  "Access was already removed, but the workflow could not complete the required cleanup. Please investigate."
                continue
              fi
            else
              echo "Access revoked from repo: $REPO_NAME"
              COMMENT=$(printf '%s\n\n%s' \
                "**Access Revoked!**" \
                "- **User:** @$USERNAME
                - **Repository:** $REPO_NAME
                - **Status:** Access has been revoked.")

              if ! gh issue comment "$CURRENT_ISSUE" \
                --repo "$REPO" \
                --body "$COMMENT"; then
                report_error "$CURRENT_ISSUE" \
                  "Access was revoked, but the workflow could not complete the required cleanup. Please investigate."
                continue
              fi
            fi

            echo "Checking whether expiration label is used by another open issue."

            OTHER_ISSUES=$(gh api --paginate --slurp \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "repos/$REPO/issues?state=open&labels=$(printf '%s' "$EXPIRATION_LABEL" | jq -sRr @uri)&per_page=100" |
              jq --arg current "$CURRENT_ISSUE" \
                '[.[][] |
                  select(.pull_request == null) |
                  select((.number | tostring) != $current) |
                  {number, title}]')

            OTHER_ISSUE_COUNT=$(printf '%s\n' "$OTHER_ISSUES" | jq 'length')

            if [ "$OTHER_ISSUE_COUNT" -eq 0 ]; then
              echo "No other open issue is using $EXPIRATION_LABEL."
            else
              echo "Expiration label is still used by another open issue:"
              printf '%s\n' "$OTHER_ISSUES" |
                jq -r '.[] | "Issue #\(.number): \(.title)"'
              echo "Keeping repository label."
            fi

            echo "Closing issue #$CURRENT_ISSUE"

            if ! gh issue close "$CURRENT_ISSUE" \
              --repo "$REPO" \
              --comment "Access cleanup completed and issue closed."; then
              report_error "$CURRENT_ISSUE" \
                "Access cleanup completed, but the issue could not be closed. Please investigate."
              continue
            fi

            echo "Issue #$CURRENT_ISSUE closed."

            if [ "$OTHER_ISSUE_COUNT" -eq 0 ]; then
              echo "Deleting repository label: $EXPIRATION_LABEL"

              if ! gh label delete "$EXPIRATION_LABEL" \
                --repo "$REPO" \
                --yes; then
                echo "Repository label could not be deleted."
                if ! gh issue reopen "$CURRENT_ISSUE" --repo "$REPO"; then
                  echo "Failed to reopen issue #$CURRENT_ISSUE after label deletion failure."
                fi
                report_error "$CURRENT_ISSUE" \
                  "Access was revoked and the issue was closed, but the expiration label '$EXPIRATION_LABEL' could not be deleted. Please investigate."
                continue
              fi

              echo "Repository label deleted: $EXPIRATION_LABEL"
            else
              echo "Removing expiration label from issue #$CURRENT_ISSUE"

              if ! gh issue edit "$CURRENT_ISSUE" \
                --repo "$REPO" \
                --remove-label "$EXPIRATION_LABEL"; then
                echo "Expiration label could not be removed."
                if ! gh issue reopen "$CURRENT_ISSUE" --repo "$REPO"; then
                  echo "Failed to reopen issue #$CURRENT_ISSUE after expiration label removal failure."
                fi
                report_error "$CURRENT_ISSUE" \
                  "Access was revoked and the issue was closed, but the expiration label could not be removed from the issue. Please investigate."
                continue
              fi

              echo "Expiration label removed from issue."
            fi
          done < <(jq -c '.[]' issues.json)

          if [ "$FAILED" = true ]; then
            echo "Revocation completed with errors."
            exit 1
          fi
          echo "Revocation complete."
