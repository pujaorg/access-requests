name: Revoke Expired Access

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  revoke:
    runs-on: ubuntu-latest
    steps:
      - name: Revoke expired access
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
          REPO: ${{ github.repository }}
          ORG: ${{ github.repository_owner }}
        run: |
          set -e
          FAILED=false
          RESPONSIBLE_USER="pujadas02"

          extract_value() {
            local field="$1" body="$2"
            local value
            value=$(echo "$body" | grep -A1 -F "$field" | tail -1 | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')

            if [[ "$value" == "---"* || "$value" == "###"* ]]; then
              value=""
            fi

            echo "$value"
          }

          revoke_repo() {
            local user="$1" repo="$2" issue="$3"

            [[ "$repo" != *"/"* ]] && repo="$ORG/$repo"

            echo "Removing $user from repo $repo"

            if gh api -X DELETE "repos/$repo/collaborators/$user" --silent; then
              echo "Collaborator removed"
            else
              echo "Failed to remove collaborator"

              gh issue comment "$issue" --repo "$REPO" \
                --body "@$RESPONSIBLE_USER Failed to revoke access from repo: $repo. Access was not revoked. Please investigate."

              FAILED=true
              return
            fi

            gh issue comment "$issue" --repo "$REPO" \
              --body "Access revoked from repo: $repo"

            echo "Closing issue #$issue"

            gh issue close "$issue" --repo "$REPO" \
              --comment "Access revoked and issue closed."
          }

          gh issue list --repo "$REPO" \
            --label "access-request,repo-based" \
            --state open \
            --json number,body,labels \
            --limit 1000 > issues.json

          CURRENT_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          echo "Current time (UTC): $CURRENT_TIME"

          ISSUE_COUNT=$(jq 'length' issues.json)
          echo "Found $ISSUE_COUNT open repo-based issues."

          if [ "$ISSUE_COUNT" -eq 0 ]; then
            echo "No open repo-based issues found. Exiting."
            exit 0
          fi

          while read -r issue; do
            ISSUE_NUMBER=$(echo "$issue" | jq -r '.number')
            BODY=$(echo "$issue" | jq -r '.body')
            LABELS=$(echo "$issue" | jq -r '.labels[].name')

            echo "Processing issue #$ISSUE_NUMBER"

            EXPIRATION_LABELS=$(echo "$LABELS" |
              grep -oP 'expires-[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z' || true)

            EXPIRATION_COUNT=$(printf '%s\n' "$EXPIRATION_LABELS" | grep -c . || true)

            echo "Expiration labels found: $EXPIRATION_COUNT"

            if [ "$EXPIRATION_COUNT" -eq 0 ]; then
              echo "No expiration label found for issue #$ISSUE_NUMBER"

              gh issue comment "$ISSUE_NUMBER" --repo "$REPO" \
                --body "@$RESPONSIBLE_USER Expiration label not found. Access was not revoked. Please investigate."

              FAILED=true
              continue
            fi

            if [ "$EXPIRATION_COUNT" -gt 1 ]; then
              echo "Multiple expiration labels found for issue #$ISSUE_NUMBER"

              gh issue comment "$ISSUE_NUMBER" --repo "$REPO" \
                --body "@$RESPONSIBLE_USER Multiple expiration labels found. Access was not revoked. Please investigate."

              FAILED=true
              continue
            fi

            EXPIRATION_LABEL="$EXPIRATION_LABELS"

            echo "Expiration label found: '$EXPIRATION_LABEL'"

            EXPIRATION=${EXPIRATION_LABEL#expires-}

            echo "Expiration date: $EXPIRATION"

            if [[ "$CURRENT_TIME" > "$EXPIRATION" || "$CURRENT_TIME" == "$EXPIRATION" ]]; then
              echo "Expired"

              USERNAME=$(extract_value "GitHub Username" "$BODY")
              REPO_NAME=$(extract_value "Repository Name" "$BODY")

              echo "Username: $USERNAME"
              echo "Repo: $REPO_NAME"

              if [ -z "$USERNAME" ] || [ -z "$REPO_NAME" ]; then
                echo "Could not determine username or repository for issue #$ISSUE_NUMBER"

                gh issue comment "$ISSUE_NUMBER" --repo "$REPO" \
                  --body "@$RESPONSIBLE_USER Could not determine the GitHub username or repository. Access was not revoked. Please investigate."

                FAILED=true
                continue
              fi

              revoke_repo "$USERNAME" "$REPO_NAME" "$ISSUE_NUMBER"
            else
              echo "Not expired yet."
            fi
          done < <(jq -c '.[]' issues.json)

          echo "Revocation complete."
